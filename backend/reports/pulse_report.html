<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Art Guide Pulse Monitor — Report</title>
  <style>
    :root {
      --bg: #faf9f7;
      --card: #ffffff;
      --text: #1c1b19;
      --muted: #5c5852;
      --line: #e6e3dd;
      --accent: #2c5282;
      --inst: #2d3748;
      --buzz: #9b2c2c;
      --mom: #276749;
      --error-bg: #fff5f5;
      --error-border: #feb2b2;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Georgia", "Times New Roman", serif;
      font-size: 17px;
      line-height: 1.55;
      color: var(--text);
      background: var(--bg);
    }
    main { max-width: 52rem; margin: 0 auto; padding: 2rem 1.25rem 3rem; }
    header {
      border-bottom: 1px solid var(--line);
      background: var(--card);
      padding: 2rem 1.25rem;
    }
    header .inner { max-width: 52rem; margin: 0 auto; }
    h1 {
      font-size: 1.65rem;
      font-weight: 500;
      letter-spacing: 0.02em;
      margin: 0 0 0.35rem;
    }
    .meta {
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      font-size: 0.85rem;
      color: var(--muted);
    }
    .meta code { font-size: 0.8rem; }
    h2 {
      font-size: 1.2rem;
      font-weight: 600;
      margin: 2.25rem 0 1rem;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .cards {
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 1.35rem 1.4rem 1.5rem;
      box-shadow: 0 1px 2px rgba(0,0,0,0.04);
    }
    .kicker {
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--muted);
      margin: 0 0 0.35rem;
    }
    .institution {
      font-size: 1.35rem;
      font-weight: 500;
      margin: 0 0 0.75rem;
      line-height: 1.25;
    }
    .exhibition {
      margin: 0 0 1rem;
      color: var(--text);
    }
    .field-label {
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--muted);
      display: block;
      margin-bottom: 0.25rem;
    }
    .pulse-row {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      flex-wrap: wrap;
      margin-bottom: 0.35rem;
    }
    .badge {
      display: inline-block;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 0.35rem 0.65rem;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: #f4f2ee;
      color: var(--text);
    }
    .badge--institutional { border-color: #cbd5e0; background: #edf2f7; color: var(--inst); }
    .badge--buzz { border-color: #fbb6b6; background: #fff5f5; color: var(--buzz); }
    .badge--momentum { border-color: #9ae6b4; background: #f0fff4; color: var(--mom); }
    .score {
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      font-size: 1.35rem;
      font-weight: 700;
      color: var(--accent);
    }
    .sub-scores {
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      font-size: 0.8rem;
      margin: 0 0 1rem;
    }
    .muted { color: var(--muted); }
    .field { margin-top: 1rem; }
    .field:first-of-type { margin-top: 0; }
    .summary { margin: 0; white-space: pre-wrap; }
    .url { margin: 0; word-break: break-word; }
    .source-link {
      color: var(--accent);
      text-decoration: underline;
      text-underline-offset: 3px;
    }
    .source-link:hover { text-decoration-thickness: 2px; }
    .error {
      margin-top: 1rem;
      padding: 0.85rem 1rem;
      background: var(--error-bg);
      border: 1px solid var(--error-border);
      border-radius: 8px;
    }
    .error p { margin: 0.35rem 0 0; }
    .review {
      margin-top: 1.1rem;
      padding-top: 1rem;
      border-top: 1px dashed var(--line);
    }
    .empty {
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      color: var(--muted);
      padding: 2rem 0;
    }
  </style>
</head>
<body>
  <header>
    <div class="inner">
      <h1>Art Guide Pulse Monitor — Report</h1>
      <p class="meta">0 entries · Generated 2026-08-23 19:58 UTC · Source <code>/Users/jungmechai/projects/artmonitor/backend/data/pulse_updates.csv</code></p>
    </div>
  </header>
  <main>
<p class="empty">No rows found in the CSV. Run <code>python backend/src/main.py run</code> first.</p>
  </main>
</body>
</html>
